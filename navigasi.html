<!DOCTYPE html>
<html>
<head>

    <title>Menu Navigasi Flexbox</title>

    <style>

        body {
            font-family: Arial;
            margin: 20px;
            background-color: #f2f2f2;
        }

        h2 {
            text-align: center;
        }

        .menu {
            display: flex;
            justify-content: flex-start;
            gap: 20px;
            background-color: #333;
            padding: 15px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .menu a:hover {
            color: yellow;
        }

    </style>

</head>
<body>

    <h2>Menu Navigasi</h2>
    <nav class="menu">

        <a href="#">Home</a>
        <a href="#">Profil</a>
        <a href="#">Galeri</a>
        <a href="#">Layanan</a>
        <a href="#">Kontak</a>
    </nav>
</body>
</html>
